name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly: picks up notes published in the Obsidian vault, and keeps values
  # computed at build time (years of experience, tenure, the career-uptime
  # strip in website mode) current.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# One run at a time, so an older build can never deploy over a newer one
# while the test job runs. A newer run waits (replacing any already waiting)
# instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The vault is private and this repo is public. Only this job sees the vault
  # deploy key. It installs packages without running their scripts and runs
  # only the sync (plus the Markdown parser it loads), fetches just Markdown and
  # attachments, and hands the build the published notes only (already public
  # on the site).
  garden:
    runs-on: ubuntu-latest
    env:
      HAS_VAULT_KEY: ${{ secrets.VAULT_DEPLOY_KEY != '' }}
    outputs:
      synced: ${{ env.HAS_VAULT_KEY }}
    steps:
      - name: Checkout your repository using git
        if: env.HAS_VAULT_KEY == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        if: env.HAS_VAULT_KEY == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies without running their scripts
        if: env.HAS_VAULT_KEY == 'true'
        run: npx --yes pnpm@10.33.2 install --frozen-lockfile --ignore-scripts
      - name: Check out the Obsidian vault
        if: env.HAS_VAULT_KEY == 'true'
        uses: actions/checkout@v6
        with:
          repository: PePoDev/obsidian-vault
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: .vault
          fetch-depth: 0 # commit history dates each note
          filter: blob:none # without downloading old file versions
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            **/*.md
            /Attachments/
            /.obsidian/app.json
          persist-credentials: false
          show-progress: false
      - name: Sync published garden notes
        if: env.HAS_VAULT_KEY == 'true'
        run: node scripts/sync-garden.mjs --vault .vault
      - name: Upload published garden notes
        if: env.HAS_VAULT_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: garden
          path: |
            src/content/garden
            src/assets/garden
          retention-days: 1

  build:
    needs: garden
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install pnpm (the version in package.json "packageManager")
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Download published garden notes
        if: needs.garden.outputs.synced == 'true'
        uses: actions/download-artifact@v8
        with:
          name: garden
          path: src
      # next build, plus scripts/prebuild.mjs and scripts/postbuild.mjs; the
      # static export lands in out/.
      - name: Build the site
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/
          include-hidden-files: true

  # Runs the Playwright suite against the site the build job uploaded, so the
  # deploy job only ever publishes a build that passed.
  test:
    needs: [garden, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Read by playwright.config.ts: serve out/ with scripts/serve-static.mjs
      # (`pnpm preview`, which behaves like GitHub Pages), in Google Chrome,
      # which plays the AAC music that Playwright's bundled Chromium cannot.
      PLAYWRIGHT_SERVER: preview
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install pnpm (the version in package.json "packageManager")
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24 # The same Node as the build job
          cache: pnpm
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Install Google Chrome
        run: pnpm exec playwright install chrome
      - name: Download the site the build job uploaded
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages
      - name: Unpack it into out/
        run: mkdir out && tar -xf "$RUNNER_TEMP/github-pages/artifact.tar" -C out
      # tests/e2e/garden.spec.ts skips itself without the synced notes.
      - name: Download published garden notes
        if: needs.garden.outputs.synced == 'true'
        uses: actions/download-artifact@v8
        with:
          name: garden
          path: src
      - name: Run the Playwright suite
        run: pnpm test:e2e
      # Every run, not just failures: a test that passes on retry leaves the
      # job green, and the report is where it shows as flaky.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
