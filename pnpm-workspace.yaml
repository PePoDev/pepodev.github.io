allowBuilds:
  # esbuild runs from its platform package; its postinstall only verifies
  # and speeds up finding the binary, so it stays off.
  esbuild: false
  sharp: true
# Resolve only versions published at least 3 days (4320 minutes) ago, the
# same rule Dependabot's npm updates apply: a lockfile holding a younger
# version fails every Dependabot update until that version is 3 days old.
minimumReleaseAge: 4320
# Patched versions of build-time dependencies that pnpm audit flags:
# source-map-js (GHSA-68fv-2mgg-jv7q, via the postcss that Next.js pins).
# Drop an entry once Next.js's own dependency ranges exclude the bad versions.
overrides:
  source-map-js: ^1.2.2
